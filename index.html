<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nabung Harian</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
  
<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
*{box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#2563eb,#22c55e);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(15px);
  border-radius:20px;
  padding:25px;
  color:#fff;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1{text-align:center;margin:5px 0}
.subtitle{text-align:center;font-size:14px;opacity:.9}

.amount{
  text-align:center;
  font-size:22px;
  font-weight:600;
  margin:20px 0 5px
}

.target{
  text-align:center;
  font-size:13px;
  opacity:.85
}

.progress{
  background:rgba(255,255,255,.25);
  border-radius:20px;
  height:14px;
  overflow:hidden;
  margin:15px 0
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#22c55e,#a7f3d0);
  transition:.4s
}

label{font-size:13px;opacity:.9}

input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:15px
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.15s
}

button:hover{transform:translateY(-2px)}
button:disabled{opacity:.6;cursor:not-allowed}

.btn-check{
  background:linear-gradient(135deg,#22c55e,#4ade80);
  color:#064e3b
}

.btn-remind{
  background:rgba(59,130,246,.9);
  color:#fff
}

.btn-reset{
  background:rgba(239,68,68,.85);
  color:#fff
}

.footer{
  text-align:center;
  font-size:12px;
  margin-top:18px;
  opacity:.85
}

.copyright{
  display:block;
  margin-top:6px;
  font-size:11px;
  opacity:.75
}

#reader{width:100%}
</style>
</head>

<body>

<script>
/* ================= QR GATE ================= */
const SECRET_CODE = "00020101021126640017ID.CO.BANKBSI.WWW0118936004510000218156021000006405390303URE51440014ID.CO.QRIS.WWW0215ID10232846648290303URE5204866153033605802ID5924DONASI SEKOLAH SMK IPTEK6009SUKOHARJO61055756262070703A0163043548";

if (!localStorage.getItem("celengan_unlock")) {

  document.body.innerHTML = `
  <div class="card">
    <h1>📷 Scan QR Celengan</h1>
    <p class="subtitle">Arahkan kamera belakang ke QR</p>
    <div id="reader"></div>
    <p id="scanStatus" style="text-align:center;margin-top:10px"></p>

    <div class="footer">
      © <span id="year"></span> Hisyam AK. All rights reserved.
    </div>
  </div>
  `;

  document.getElementById("year").textContent = new Date().getFullYear();

  const qr = new Html5Qrcode("reader");

  qr.start(
    { facingMode: "environment" },   // kamera belakang
    { fps: 10, qrbox: 250 },
    text => {
      if (text === SECRET_CODE) {
        localStorage.setItem("celengan_unlock", "true");
        qr.stop();
        location.reload();
      } else {
        document.getElementById("scanStatus").innerText = "❌ QR tidak valid";
      }
    }
  ).catch(() => {
    document.getElementById("scanStatus").innerText =
      "❌ Kamera tidak bisa diakses";
  });

} else {

/* ================= APP NABUNG ================= */
document.body.innerHTML = `
<div class="card">
  <h1>💰 Nabung Harian</h1>
  <p class="subtitle">Sedikit demi sedikit jadi satu juta</p>

  <div class="amount" id="amount">Rp0</div>
  <div class="target">Target Rp1.000.000</div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <label>Nominal nabung per hari</label>
  <input type="number" id="dailyInput">

  <button class="btn-check" id="checkBtn">✅ Nabung Hari Ini</button>
  <button class="btn-remind" id="remindBtn">🔔 Aktifkan Pengingat</button>
  <button class="btn-reset" id="resetBtn">🔄 Reset Tabungan</button>

  <div class="footer">
    🔥 Konsisten lebih penting dari besar nominal
    <span class="copyright">
      © <span id="year"></span> Hisyam AK. All rights reserved.
    </span>
  </div>
</div>
`;

document.getElementById("year").textContent = new Date().getFullYear();

const target = 1000000;
const today = new Date().toDateString();

let data = JSON.parse(localStorage.getItem("nabung")) || {
  total:0,
  daily:10000,
  lastDate:"",
  reminder:true
};

const amount = document.getElementById("amount");
const bar = document.getElementById("progressBar");
const dailyInput = document.getElementById("dailyInput");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const remindBtn = document.getElementById("remindBtn");

dailyInput.value = data.daily;

function updateUI(){
  amount.textContent = "Rp" + data.total.toLocaleString();
  bar.style.width = Math.min((data.total/target)*100,100) + "%";

  if(data.lastDate === today){
    checkBtn.disabled = true;
    checkBtn.textContent = "✔ Sudah Nabung Hari Ini";
  }
}

updateUI();

dailyInput.onchange = ()=>{
  data.daily = Number(dailyInput.value);
  localStorage.setItem("nabung",JSON.stringify(data));
};

checkBtn.onclick = ()=>{
  if(data.lastDate !== today){
    data.total += data.daily;
    data.lastDate = today;
    localStorage.setItem("nabung",JSON.stringify(data));
    updateUI();
  }
};

resetBtn.onclick = ()=>{
  if(confirm("Yakin reset semua tabungan?")){
    localStorage.clear();
    location.reload();
  }
};

/* ===== NOTIFIKASI ===== */
remindBtn.onclick = async ()=>{
  if(!("Notification" in window)){
    alert("Browser tidak mendukung notifikasi");
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm === "granted"){
    alert("🔔 Pengingat aktif (jam 08:00)");
    data.reminder = true;
    localStorage.setItem("nabung",JSON.stringify(data));
  }
};

setInterval(()=>{
  if(!data.reminder || Notification.permission !== "granted") return;
  const now = new Date();
  if(now.getHours() === 8 && now.getMinutes() === 0 && data.lastDate !== today){
    new Notification("💰 Waktunya Nabung!",{
      body: `Jangan lupa nabung Rp${data.daily.toLocaleString()} hari ini`
    });
  }
},60000);

}
</script>

</body>
</html>
